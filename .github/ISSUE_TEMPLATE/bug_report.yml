name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If fix-storage deleted or moved something it shouldn't have, please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: fix-storage --dry-run
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fix-storage version
      description: Shown in the installer output, or `node -p "require('$HOME/.fix-storage/node_modules/fix-storage/package.json').version"`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and chip
      description: On Linux, also the distribution, and the output of `fix-storage --drives` if it is about drives.
      placeholder: macOS 15.2, Apple M2 / Ubuntu 24.04, x86_64 / Windows 11 24H2, x64
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Ghostty 1.1, iTerm2 3.5, Terminal.app, Windows Terminal 1.25
  - type: textarea
    id: output
    attributes:
      label: Screenshot or output
      description: A screenshot of the interface, or the output of `fix-storage --plain`.
