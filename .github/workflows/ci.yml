name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22, 24]
    env:
      # The graphics runtime isn't needed to build or to run the text modes.
      PIXEL_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test the text modes
        run: |
          node bin/fix-storage.cjs --help
          node bin/fix-storage.cjs --demo --plain
          node bin/fix-storage.cjs --demo --json | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'
      - name: Package contents
        run: npm pack --dry-run

  test:
    name: Disk usage regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      PIXEL_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun test

  installer:
    name: Lint install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=sh install.sh
